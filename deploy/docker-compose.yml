# dawg en el VPS: el servidor del juego + Caddy (HTTPS automático con Let's Encrypt).
# Uso (dentro de la carpeta deploy):  docker compose up -d --build
services:
  dawg:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dawg:latest
    container_name: dawg
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "2567"
    expose:
      - "2567"

  caddy:
    image: caddy:2.8.4-alpine
    container_name: dawg-caddy
    restart: unless-stopped
    depends_on:
      - dawg
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
